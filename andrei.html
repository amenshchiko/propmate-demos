<style>
  :root {
    --navy: #0D1B2A;
    --teal: #1A5C53;
    --teal-dark: #143F39;
    --teal-on-dark: #4DB89A;
    --white: #FFFFFF;
    --off-white: #EAEBE8;
    --mid-grey: #666666;
    --footer: #060E15;
    --font-display: "Barlow Condensed", "Arial Narrow", Arial, Helvetica, sans-serif;
    --font-body: Epilogue, Arial, Helvetica, sans-serif;
    --font-data: "IBM Plex Mono", Consolas, "Courier New", monospace;
  }
  *, *::before, *::after { box-sizing: border-box; border-radius: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--white);
    color: var(--navy);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .head :focus-visible, .foot :focus-visible { outline-color: var(--white); }

  .card { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  /* Wordmark */
  .wordmark { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1; white-space: nowrap; text-decoration: none; }
  .wordmark .dot { color: var(--teal-on-dark); animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .wordmark .dot { animation: none; } .reveal { animation: none !important; } }

  /* Navy header block */
  .head {
    background: var(--navy);
    color: var(--white);
    padding: calc(24px + env(safe-area-inset-top)) 24px 32px;
    display: flex; flex-direction: column; gap: 32px;
  }
  .head .wordmark { font-size: 18px; color: var(--white); align-self: flex-start; }
  .intro { display: flex; flex-direction: column; gap: 16px; }

  /* Photo: square, corner brackets */
  .photo { position: relative; width: 128px; height: 128px; padding: 8px; }
  .photo::before, .photo::after { content: ""; position: absolute; width: 20px; height: 20px; border: 0 solid var(--white); }
  .photo::before { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
  .photo::after { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
  .photo-inner {
    width: 112px; height: 112px; overflow: hidden;
    background: var(--off-white);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 32px; letter-spacing: 0.08em; color: var(--navy);
  }
  .photo-inner img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

  .name { margin: 8px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; }
  .role { margin: 0; font-family: var(--font-data); font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.72); }
  .tagline { margin: 0; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,0.72); text-wrap: pretty; }

  .lead { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .icon { width: 20px; height: 20px; flex: none; display: block; }
  /* Actions */
  .actions { flex: 1; padding: 32px 24px 40px; display: flex; flex-direction: column; gap: 12px; }
  .label { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--navy); }

  .btn {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 56px; width: 100%;
    padding: 12px 20px;
    text-decoration: none;
    font-family: var(--font-body); font-weight: 600; font-size: 15px; line-height: 1.2;
    transition: background-color 200ms, color 200ms, border-color 200ms;
    -webkit-tap-highlight-color: transparent;
  }
  .btn .arrow { font-family: var(--font-body); font-weight: 500; flex: none; }
  .btn-primary { background: var(--teal); color: var(--white); min-height: 64px; font-size: 16px; margin-bottom: 8px; }
  .btn-primary:hover, .btn-primary:active { background: var(--teal-dark); }

  .btn-secondary { background: var(--white); color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-secondary:hover, .btn-secondary:active { border-color: var(--teal); color: var(--teal); }
  .btn-secondary .text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .btn-secondary .value { font-family: var(--font-data); font-weight: 400; font-size: 12px; color: var(--mid-grey); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-secondary:hover .value { color: var(--teal); }

  /* Footer */
  .foot {
    background: var(--footer); color: var(--white);
    padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .foot .wordmark { font-size: 22px; color: var(--white); }
  .foot .meta { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.55); }

  /* Load-in */
  .reveal { animation: fadeUp 500ms ease-out both; }
  .reveal-2 { animation-delay: 80ms; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Small phones */
  @media (max-width: 350px) {
    .name { font-size: 38px; }
    .head, .actions, .foot { padding-left: 16px; padding-right: 16px; }
  }

  /* Desktop: framed card on an off-white page */
  @media (min-width: 640px) {
    body { background: var(--off-white); padding: 64px 24px; }
    .card { min-height: 0; box-shadow: 8px 8px 0 rgba(13, 27, 42, 0.06); background: var(--white); }
    .head { padding: 32px 40px 40px; }
    .actions { padding: 40px; }
    .foot { padding: 24px 40px; }
  }
</style>
